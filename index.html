<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinePilot Finance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #171717; 
    }
    ::-webkit-scrollbar-thumb {
      background: #525252; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #737373; 
    }
    .light ::-webkit-scrollbar-track {
        background: #f5f5f5; 
    }
    .light ::-webkit-scrollbar-thumb {
        background: #d4d4d4;
    }

    /* Default Brand Colors (Amber/Gold) as CSS Variables for Dynamic Switching */
    :root {
      --color-brand-50: 255 251 235;
      --color-brand-100: 254 243 199;
      --color-brand-200: 253 230 138;
      --color-brand-300: 252 211 77;
      --color-brand-400: 251 191 36;
      --color-brand-500: 245 158 11;
      --color-brand-600: 217 119 6;
      --color-brand-700: 180 83 9;
      --color-brand-800: 146 64 14;
      --color-brand-900: 120 53 15;
    }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Dynamic Brand Palette using CSS Variables
            brand: {
              50: 'rgb(var(--color-brand-50) / <alpha-value>)',
              100: 'rgb(var(--color-brand-100) / <alpha-value>)',
              200: 'rgb(var(--color-brand-200) / <alpha-value>)',
              300: 'rgb(var(--color-brand-300) / <alpha-value>)',
              400: 'rgb(var(--color-brand-400) / <alpha-value>)',
              500: 'rgb(var(--color-brand-500) / <alpha-value>)',
              600: 'rgb(var(--color-brand-600) / <alpha-value>)',
              700: 'rgb(var(--color-brand-700) / <alpha-value>)',
              800: 'rgb(var(--color-brand-800) / <alpha-value>)',
              900: 'rgb(var(--color-brand-900) / <alpha-value>)',
            },
            // True neutrals for dark mode
            gray: {
              850: '#1f1f1f',
              900: '#171717',
              950: '#0a0a0a',
            }
          }
        }
      }
    }
  </script>
  <!-- PDF Generation Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="importmap">
{
  "imports": {
    "rxjs": "https://aistudiocdn.com/rxjs@^7.8.2?conditions=es2015",
    "rxjs/operators": "https://aistudiocdn.com/rxjs@^7.8.2/operators?conditions=es2015",
    "rxjs/ajax": "https://aistudiocdn.com/rxjs@^7.8.2/ajax?conditions=es2015",
    "rxjs/webSocket": "https://aistudiocdn.com/rxjs@^7.8.2/webSocket?conditions=es2015",
    "rxjs/testing": "https://aistudiocdn.com/rxjs@^7.8.2/testing?conditions=es2015",
    "rxjs/fetch": "https://aistudiocdn.com/rxjs@^7.8.2/fetch?conditions=es2015",
    "@angular/common": "https://next.esm.sh/@angular/common@^21.0.3?external=rxjs",
    "d3": "https://next.esm.sh/d3@^7.9.0?external=rxjs",
    "@angular/core": "https://next.esm.sh/@angular/core@^21.0.3?external=rxjs",
    "@angular/compiler": "https://next.esm.sh/@angular/compiler@^21.0.3?external=rxjs",
    "@angular/router": "https://next.esm.sh/@angular/router@^21.0.3?external=rxjs",
    "@angular/platform-browser": "https://next.esm.sh/@angular/platform-browser@^21.0.3?external=rxjs",
    "@google/genai": "https://next.esm.sh/@google/genai@^1.31.0?external=rxjs",
    "@angular/forms": "https://next.esm.sh/@angular/forms@^21.0.3?external=rxjs",
    "@angular/common/http": "https://next.esm.sh/@angular/common@^21.0.3/http?external=rxjs"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-gray-50 dark:bg-neutral-950 text-gray-900 dark:text-neutral-200 font-sans antialiased h-screen overflow-hidden transition-colors duration-300">
  <app-root></app-root>
</body>
</html>
